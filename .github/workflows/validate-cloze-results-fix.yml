name: Validate cloze results fix
on:
  push:
    branches: [fix-cloze-results-20260816]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate JavaScript syntax
        run: |
          node --check results-patch.js
          node --check cloze-results-compat.js
          node --check memory-mode.js
          node --check memory-answer-toggle.js
          node --check sw.js
      - name: Validate result flow and 549-card payload
        run: |
          python - <<'PY'
          import base64,gzip,pathlib
          root=pathlib.Path('.')
          idx=(root/'index.html').read_text(encoding='utf-8')
          order=['data-transfer.js?v=2','results-patch.js?v=2','cloze-results-compat.js?v=1','memory-mode.js?v=1','memory-answer-toggle.js?v=1']
          positions=[idx.index(x) for x in order]
          assert positions==sorted(positions), positions
          rp=(root/'results-patch.js').read_text(encoding='utf-8')
          for token in ['id = \'resultView\'','function finishSession()','結果を見る →','session.pos === session.ids.length - 1','showResultView()']:
              assert token in rp, token
          compat=(root/'cloze-results-compat.js').read_text(encoding='utf-8')
          for token in ['startFromFilters=function()','resumeSession=function()','session.ratings=savedRatings']:
              assert token in compat, token
          sw=(root/'sw.js').read_text(encoding='utf-8')
          assert 'v13-cloze-results' in sw
          assert "'./results-patch.js'" in sw and "'./cloze-results-compat.js'" in sw
          parts=''.join((root/f'app.part{i:02d}').read_text(encoding='utf-8') for i in range(1,11))
          html=gzip.decompress(base64.b64decode(parts)).decode('utf-8')
          assert '"actual_cards":549' in html
          print('cloze results validation: OK')
          PY
