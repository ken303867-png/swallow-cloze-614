name: Final refactor QA
on:
  push:
    branches: [refactor-app-20260816]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor-app-20260816
      - name: Validate production file set
        run: |
          node --check data.js
          node --check migration-map.js
          node --check core.js
          node --check data-transfer.js
          node --check results.js
          node --check memory.js
          node --check sw.js
          python - <<'PY'
          import json,re,pathlib
          r=pathlib.Path('.')
          data=json.loads(re.fullmatch(r'const DATA=(.*);\s*',(r/'data.js').read_text(encoding='utf-8'),re.S).group(1))
          assert data['meta']['actual_cards']==549 and len(data['cards'])==549
          assert len({c['id'] for c in data['cards']})==549
          assert sum(len(c['answers']) for c in data['cards'])==771
          core=(r/'core.js').read_text(encoding='utf-8')
          assert "const STORE_KEY='swallow_cloze_614_independent_pwa_v1'" in core
          idx=(r/'index.html').read_text(encoding='utf-8')
          assert 'DecompressionStream' not in idx and 'app.part01' not in idx
          for f in ['styles.css','data.js','migration-map.js','core.js','data-transfer.js','results.js','memory.js']:
              assert f in idx
          sw=(r/'sw.js').read_text(encoding='utf-8')
          assert 'v14-refactor' in sw and 'app.part01' not in sw
          legacy=['app.part01','results-patch.js','cloze-results-compat.js','memory-mode.js','memory-answer-toggle.js','legacy-app.html']
          for f in legacy: assert not (r/f).exists(), f
          print('production file-set QA: OK')
          PY
      - name: Install DOM test dependency
        run: npm install --no-save jsdom@26
      - name: Run behavior smoke test
        run: |
          node <<'NODE'
          const fs=require('fs');
          const {JSDOM}=require('jsdom');
          let html=fs.readFileSync('index.html','utf8').replace(/<script[^>]*src="[^"]+"[^>]*><\/script>/g,'');
          const dom=new JSDOM(html,{url:'https://example.com/swallow-cloze-614/',runScripts:'outside-only',pretendToBeVisual:true});
          const w=dom.window;
          w.scrollTo=()=>{}; w.alert=()=>{}; w.confirm=()=>true;
          Object.defineProperty(w.navigator,'serviceWorker',{configurable:true,value:{register:()=>Promise.resolve()}});
          const files=['data.js','migration-map.js','core.js','data-transfer.js','results.js','memory.js'];
          const code=files.map(f=>fs.readFileSync(f,'utf8')).join('\n')+`\n
          (()=>{
            const ok=(x,m)=>{if(!x)throw new Error(m)};
            ok(DATA.cards.length===549,'card count');
            ok(STORE_KEY==='swallow_cloze_614_independent_pwa_v1','store key');
            const one=document.createElement('option');one.value='1';one.textContent='1問';document.getElementById('limitSel').appendChild(one);document.getElementById('limitSel').value='1';
            document.getElementById('modeSel').value='cloze';document.getElementById('startBtn').click();
            document.getElementById('showAnswerBtn').click();document.querySelector('.rating .btn[data-rate="good"]').click();document.getElementById('nextBtn').click();
            ok(!document.getElementById('resultView').classList.contains('hidden'),'cloze result view');
            ok(document.getElementById('rTotal').textContent==='1'&&document.getElementById('rGood').textContent==='1','cloze result metrics');
            document.getElementById('resultHomeBtn').click();document.getElementById('modeSel').value='memory';document.getElementById('limitSel').value='1';document.getElementById('startBtn').click();
            const box=document.getElementById('answerBox'),btn=document.getElementById('showAnswerBtn');
            ok(!box.classList.contains('show'),'memory initial hidden');btn.click();ok(box.classList.contains('show')&&btn.textContent==='答えを隠す','memory show');btn.click();ok(!box.classList.contains('show')&&btn.textContent==='答えを表示','memory hide');btn.click();document.querySelector('.rating .btn[data-rate="good"]').click();
            ok(document.getElementById('qCat').textContent.includes('暗記モード 完了'),'memory complete');
            ok(localStorage.getItem(STORE_KEY),'persisted state');window.__FINAL_QA__='OK';
          })();`;
          w.eval(code); if(w.__FINAL_QA__!=='OK')throw new Error('final QA incomplete'); console.log('final behavior QA: OK');
          NODE
