name: Final QA 1390 dataset corrections

on:
  push:
    branches: ["qa-fix-1390-s-priority"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check data-sections-01-05.js
          node --check data-sections-06-09.js
          node --check data-sections-10-13.js
          node --check data-sections-14-17.js
          node --check data.js
          node --check qa-data-patch.js
          node --check qa-b-context-patch.js
          node --check qa-b-design-patch.js
          node --check qa-b-overlap-patch.js
          node --check qa-c-style-patch.js
          node --check core.js
          node --check qa-progress-migration.js
          node --check data-transfer.js
          node --check results.js
          node --check memory.js
          node --check sw.js
      - name: Dataset and migration QA
        run: |
          node <<'NODE'
          const fs=require('fs');
          const vm=require('vm');
          const ctx={console};
          vm.createContext(ctx);
          for(const f of [
            'data-sections-01-05.js','data-sections-06-09.js',
            'data-sections-10-13.js','data-sections-14-17.js',
            'data.js','qa-data-patch.js','qa-b-context-patch.js','qa-b-design-patch.js','qa-b-overlap-patch.js','qa-c-style-patch.js'
          ]) vm.runInContext(fs.readFileSync(f,'utf8'),ctx,{filename:f});

          const snapshot=vm.runInContext(`({
            cards: DATA.cards.map(c=>({id:c.id,ref:c.ref,text:c.text,answers:c.answers,category:c.category,qa_fixed:c.qa_fixed})),
            meta: {...DATA.meta},
            categories: DATA.categories.map(c=>({...c})),
            mergeMap: {...globalThis.DATA_QA_PROGRESS_MERGE_MAP},
            bNoChange: [...globalThis.DATA_QA_B_REVIEWED_NOCHANGE_IDS],
            cNoChange: [...globalThis.DATA_QA_C_REVIEWED_NOCHANGE_IDS]
          })`,ctx);
          const {cards,meta,categories,mergeMap,bNoChange,cNoChange}=snapshot;
          const fail=m=>{throw new Error(m)};
          const eq=(a,b,m)=>{if(a!==b)fail(`${m}: expected ${b}, got ${a}`)};
          const byId=id=>cards.find(c=>c.id===id);

          // Final cardinality and metadata.
          eq(cards.length,1365,'active card count');
          eq(meta.actual_cards,1365,'meta card count');
          eq(meta.answer_terms,2293,'answer term count');
          eq(categories.reduce((n,c)=>n+c.actual,0),1365,'category card sum');
          eq(categories.reduce((n,c)=>n+c.answer_terms,0),2293,'category answer sum');
          eq(meta.data_version,'2026-08-19-compact1390-v1-finalQA','final data version');

          // Stable IDs: only intentionally removed headings/duplicates/near-duplicates are gaps.
          const ids=cards.map(c=>c.id);
          eq(new Set(ids).size,ids.length,'unique IDs');
          const excluded=[36,151,186,204,217,231,243,400,537,661,843,849,876,892,893,896,908,917,931,944,961,967,981,1162,1292];
          for(const id of excluded)if(ids.includes(id))fail(`excluded ID remains: ${id}`);
          const gaps=[];
          for(let i=1;i<=1390;i++)if(!ids.includes(i))gaps.push(i);
          if(JSON.stringify(gaps)!==JSON.stringify(excluded))fail(`unexpected ID gaps: ${gaps}`);

          // Every active card must be a valid cloze card.
          for(const c of cards){
            if(!Array.isArray(c.answers)||!c.answers.length)fail(`card has no cloze answer: ${c.id}`);
            if(c.answers.some(a=>!String(a).trim()))fail(`blank cloze answer: ${c.id}`);
            const opens=(c.text.match(/（/g)||[]).length;
            const closes=(c.text.match(/）/g)||[]).length;
            if(opens!==closes)fail(`full-width bracket mismatch: ${c.id} ${c.text}`);
            const parsed=[...c.text.matchAll(/（([^（）]+)）/g)].map(m=>m[1]);
            if(JSON.stringify(c.answers)!==JSON.stringify(parsed))fail(`answer extraction mismatch: ${c.id}`);
            if(c.answers.length>4)fail(`excessive cloze count remains ${c.id}: ${c.answers.length}`);
            if(/^\d{3}\.\s*/.test(c.text))fail(`source manuscript number remains: ${c.id}`);
          }

          // S fixes.
          const sExpected=new Map([
            [112,'構成失行の主な責任病巣（右頭頂葉）'],
            [242,'プロフィール5は、（むせることがしばしば）で、（全量飲むことが困難）である。'],
            [293,'K-point刺激の対象には、（嚥下反射惹起遅延）（重度嚥下障害）も含まれる。'],
            [401,'VEでは、検査食に（青色）や（緑色）などの食用着色料を添加し、（咽頭残留）や（喉頭侵入）などを評価する。'],
            [738,'レビー小体型認知症では、（認知機能の変動）（幻視）（パーキンソニズム）が特徴である。'],
            [746,'レビー小体型認知症などで視空間認知障害がある場合は、できる動作に合わせて（食器の位置）を調整する。'],
            [1042,'ACE阻害薬カプトプリルでは、（サブスタンスP増加）などを介して（嚥下反射）（咳反射）の改善がみられることがある。']
          ]);
          for(const [id,text] of sExpected){const c=byId(id);if(!c)fail(`S fixed card missing ${id}`);eq(c.text,text,`S fixed text ${id}`);}

          // A context fixes.
          for(const id of [245,246,247,248,249,250,251,252])if(!byId(id).text.startsWith('MWST'))fail(`MWST context missing ${id}`);
          for(const id of [254,255,256,257,258,259,260,261])if(!byId(id).text.startsWith('フードテスト'))fail(`Food Test context missing ${id}`);
          for(const id of [943,945,955,970,975])if(!byId(id).text.match(/ギラン・バレー症候群|炎症性筋疾患・皮膚筋炎|重症筋無力症/))fail(`disease context missing ${id}`);
          eq(byId(259).answers.length,3,'Food Test score3 cloze count');
          eq(byId(970).answers.length,3,'myasthenia symptom cloze count');
          eq(byId(746).answers[0],'食器の位置','DLB long cloze shortened');

          // B1 context and weak-cloze fixes.
          for(let id=139;id<=161;id++)if(id!==151&&!byId(id).text.startsWith('DSSの'))fail(`DSS context missing ${id}`);
          for(let id=175;id<=189;id++)if(id!==186&&!byId(id).text.includes('摂食・嚥下能力グレード'))fail(`ability grade context missing ${id}`);
          for(const id of [192,193,194,195,198,199,200,201,202,203,205,206])if(!byId(id).text.startsWith('摂食状況レベル'))fail(`feeding status context missing ${id}`);
          if(!byId(133).text.startsWith('摂食状況レベル3'))fail('retained level3 context missing');
          if(JSON.stringify(bNoChange)!==JSON.stringify([196,197]))fail(`B no-change IDs mismatch ${JSON.stringify(bNoChange)}`);
          for(const id of [12,15,161,168,710,1008,1009,1205]){
            const c=byId(id);if(!c)fail(`weak-cloze card missing ${id}`);
            const weak=new Set(['ある','ない','困難','必要','不要','制限']);
            if(c.answers.some(a=>weak.has(a)))fail(`weak cloze term remains ${id}: ${c.answers}`);
          }

          // B2 cloze-design fixes.
          const holeIds=[32,40,76,119,259,289,292,335,385,402,403,970,1106,1333,1379];
          for(const id of holeIds){const c=byId(id);if(!c)fail(`hole-design card missing ${id}`);if(c.answers.length>3)fail(`hole-design count still high ${id}: ${c.answers.length}`);}
          if(byId(1106).text.includes('Coarse crackles（'))fail('Coarse crackles alias still parsed as cloze');
          const longIds=[98,122,133,227,331,351,359,424,598,599,608,612,613,618,619,620,735,737,746,754,824,1018,1062,1092,1093,1101,1157,1163,1164,1224,1234];
          for(const id of longIds){const c=byId(id);if(!c)fail(`long-cloze card missing ${id}`);if(!String(c.qa_fixed).includes('B2'))fail(`B2 marker missing ${id}`);}
          eq(byId(122).answers[0],'2回以上','MWST5 threshold shortened');
          eq(byId(598).answers[0],'随意的嚥下','pediatric long cloze shortened');
          eq(byId(1093).answers[0],'150mmHg以下','suction pressure cloze shortened');

          // Near-duplicate consolidation.
          const nearPairs=[[824,892],[822,931],[646,661],[1024,1162],[134,217],[133,204],[176,186],[830,843],[823,896],[825,893],[1360,36],[125,151],[826,876],[827,908],[828,917]];
          for(const [keep,drop] of nearPairs){if(!byId(keep))fail(`near-duplicate retained card missing ${keep}`);if(byId(drop))fail(`near-duplicate card not removed ${drop}`);}
          eq(byId(125).text,'DSS3［水分誤嚥レベル］では、（水分）は誤嚥するが、（工夫した食物）は誤嚥しない。','DSS duplicate integrated');
          if(!byId(826).text.includes('進行性変性疾患'))fail('Parkinson near-duplicate nuance not integrated');
          if(!byId(827).text.includes('臨床症状'))fail('MSA near-duplicate nuance not integrated');

          // C notation and punctuation normalization.
          const punctuationIds=[107,542,781,1010,1147];
          for(const id of punctuationIds)if(!byId(id).text.endsWith('。'))fail(`final punctuation missing ${id}`);
          eq(byId(483).answers[0],'pull-back motion','pull-back notation');
          eq(byId(484).answers[0],'squeeze-back motion','squeeze-back notation');
          for(let id=769;id<=780;id++){
            const c=byId(id);if(!c)fail(`DLB notation card missing ${id}`);
            if(!c.text.startsWith('レビー小体型認知症'))fail(`DLB disease notation not normalized ${id}: ${c.text}`);
          }
          eq(byId(770).answers[0],'レビー小体','Lewy body pathology notation');
          for(const c of cards){
            if(c.text.includes('Lewy小体型認知症'))fail(`English/Japanese mixed DLB label remains ${c.id}`);
            if(c.text.includes('頭頸部癌'))fail(`頭頸部癌 notation remains ${c.id}`);
            if(c.text.includes('pull back motion'))fail(`pull back motion spacing remains ${c.id}`);
            if(c.text.includes('squeeze back motion'))fail(`squeeze back motion spacing remains ${c.id}`);
          }
          const expectedCNoChange=[248,250,257,259,476,480,509,510,737,739,740,741,742,743,746,747,1003,1038,1150,1289];
          if(JSON.stringify(cNoChange)!==JSON.stringify(expectedCNoChange))fail(`C no-change IDs mismatch ${JSON.stringify(cNoChange)}`);
          for(const id of [248,250,257,259])if(!byId(id).text.includes('and/or') && id!==259)fail(`and/or notation unexpectedly changed ${id}`);
          if(categories.some(c=>String(c.name).includes('〕')))fail('source heading bracket leaked into category name');

          // No literal duplicates remain.
          const literalGroups=new Map();
          for(const c of cards){if(!literalGroups.has(c.text))literalGroups.set(c.text,[]);literalGroups.get(c.text).push(c.id);}
          const literals=[...literalGroups.entries()].filter(([,v])=>v.length>1);
          if(literals.length)fail(`literal duplicates remain: ${JSON.stringify(literals.slice(0,10))}`);

          // All duplicate/near-duplicate histories map to surviving IDs.
          const expectedMerge={36:1360,151:125,186:176,204:133,217:134,661:646,843:830,849:829,876:826,892:824,893:825,896:823,908:827,917:828,931:822,944:821,961:833,967:832,981:820,1162:1024,1292:1289};
          const sortedObj=o=>Object.fromEntries(Object.entries(o).sort((a,b)=>Number(a[0])-Number(b[0])));
          if(JSON.stringify(sortedObj(mergeMap))!==JSON.stringify(sortedObj(expectedMerge)))fail(`merge map mismatch ${JSON.stringify(mergeMap)}`);
          ctx.state={
            progress:{824:{status:'good',uncertain:false,bookmarked:false,attempts:2,good:2,review:0,lastAt:'2026-08-18T10:00:00Z'},892:{status:'review',uncertain:true,bookmarked:true,attempts:3,good:0,review:3,lastAt:'2026-08-19T10:00:00Z'},829:{status:'good',attempts:1,good:1,review:0},849:{status:'review',attempts:1,good:0,review:1}},
            memoryProgress:{824:{status:'memorized',attempts:1,remembered:1,again:0},892:{status:'learning',attempts:2,remembered:0,again:2}},
            lastSession:{ids:[824,892,829,849],pos:1},
            memorySession:{initialIds:[824,892],ids:[892,824],pos:0,nextIds:[892]}
          };
          ctx.STORE_KEY='qa-test';ctx.localStorage={setItem(){}};ctx.refreshSummary=()=>{};
          vm.runInContext(fs.readFileSync('qa-progress-migration.js','utf8'),ctx,{filename:'qa-progress-migration.js'});
          const migrated=ctx.state;
          if(migrated.progress['892']||migrated.progress['849'])fail('source progress not removed');
          eq(migrated.progress['824'].status,'review','normal status precedence');eq(migrated.progress['824'].attempts,5,'normal attempts merged');
          if(migrated.memoryProgress['892'])fail('source memory progress not removed');eq(migrated.memoryProgress['824'].status,'learning','memory status precedence');
          if(new Set(migrated.lastSession.ids).size!==migrated.lastSession.ids.length)fail('lastSession not deduplicated');
          if(migrated.lastSession.ids.some(id=>excluded.includes(id)))fail('lastSession contains excluded ID');
          if(migrated.memorySession?.ids?.some(id=>excluded.includes(id)))fail('memorySession contains excluded ID');

          console.log(`FINAL QA PASS: ${cards.length} active cards, ${meta.answer_terms} cloze terms; S/A/B/C fixes, duplicate consolidation, notation, brackets, and history migration verified.`);
          NODE
