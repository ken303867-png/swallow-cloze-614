name: Build refactor
on:
  push:
    branches: [refactor-app-20260816]
permissions:
  contents: write
jobs:
  build:
    if: github.event.head_commit.message != 'Commit refactor build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor-app-20260816
      - name: Wait for extracted analysis files
        run: |
          test -f legacy-base.js
          test -f legacy-style.css
          test -f legacy-shell.html
      - name: Build refactor
        run: python scripts/build_refactor.py
      - name: Commit generated refactor files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js migration-map.js core.js styles.css results.js memory.js index.refactor.html sw.refactor.js
          git diff --cached --quiet || git commit -m "Commit refactor build"
          git push
