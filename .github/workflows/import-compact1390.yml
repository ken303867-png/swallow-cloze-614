name: Import compact 1390 dataset
on:
  push:
    branches: [replace-data-compact-1390-20260819]
permissions:
  contents: write
jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: replace-data-compact-1390-20260819
      - name: Extract generated production files
        shell: bash
        run: |
          cat > /tmp/compact1390.b64 <<'PAYLOAD'

PAYLOAD
          base64 -d /tmp/compact1390.b64 | tar -xz
          rm -f migration-map.js
      - name: Static data and syntax QA
        run: |
          node --check data.js
          node --check core.js
          node --check data-transfer.js
          node --check results.js
          node --check memory.js
          node --check sw.js
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const ctx={}; vm.createContext(ctx);
          vm.runInContext(fs.readFileSync('data.js','utf8')+';globalThis.__DATA=DATA;',ctx);
          const d=ctx.__DATA;
          if(d.cards.length!==1390)throw new Error('card count '+d.cards.length);
          if(d.categories.length!==17)throw new Error('category count');
          if(new Set(d.cards.map(c=>c.id)).size!==1390)throw new Error('duplicate ids');
          if(d.cards.reduce((s,c)=>s+c.answers.length,0)!==2381)throw new Error('answer count');
          if(d.categories.reduce((s,c)=>s+c.actual,0)!==1390)throw new Error('category sum');
          if(d.cards.some(c=>!c.answers.length))throw new Error('missing answer');
          if(d.cards.some(c=>c.source!=='厳選コンパクト版'))throw new Error('source');
          const core=fs.readFileSync('core.js','utf8');
          if(!core.includes("const DATA_MIGRATION_VERSION='compact1390-v1'"))throw new Error('migration version');
          if(!core.includes("const STORE_KEY='swallow_cloze_614_independent_pwa_v1'"))throw new Error('store key');
          const idx=fs.readFileSync('index.html','utf8');
          if(!idx.includes('正文化穴抜き1390')||idx.includes('migration-map.js'))throw new Error('index');
          const sw=fs.readFileSync('sw.js','utf8');
          if(!sw.includes('v15-compact1390')||sw.includes('migration-map.js'))throw new Error('sw');
          console.log('static QA OK');
          NODE
      - name: Behavior smoke test
        run: |
          npm install --no-save jsdom@26 >/dev/null 2>&1
          node <<'NODE'
          const fs=require('fs'); const {JSDOM}=require('jsdom');
          let html=fs.readFileSync('index.html','utf8').replace(/<script[^>]*src="[^"]+"[^>]*><\/script>/g,'');
          const dom=new JSDOM(html,{url:'https://example.com/swallow-cloze-614/',runScripts:'outside-only',pretendToBeVisual:true});
          const w=dom.window; w.scrollTo=()=>{}; w.alert=()=>{}; w.confirm=()=>true;
          Object.defineProperty(w.navigator,'serviceWorker',{configurable:true,value:{register:()=>Promise.resolve()}});
          const KEY='swallow_cloze_614_independent_pwa_v1';
          w.localStorage.setItem(KEY,JSON.stringify({dataMigrationVersion:'cloze549-v1',progress:{'1':{status:'good',attempts:1,good:1}},lastSession:{ids:[1],pos:0},memoryProgress:{'1':{status:'memorized'}},memorySession:{ids:[1],pos:0}}));
          const code=['data.js','core.js','results.js','memory.js'].map(f=>fs.readFileSync(f,'utf8')).join('\n')+`\n(()=>{globalThis.__qa={DATA,STORE_KEY,state,session};})();`;
          w.eval(code);
          const q=w.__qa;
          if(q.DATA.cards.length!==1390)throw new Error('runtime data');
          if(Object.keys(q.state.progress).length!==0||Object.keys(q.state.memoryProgress).length!==0)throw new Error('old progress reused');
          if(!Array.isArray(q.state.archivedDataSets)||q.state.archivedDataSets.length!==1)throw new Error('old history not archived');
          const one=w.document.createElement('option'); one.value='1'; one.textContent='1問'; w.document.getElementById('limitSel').appendChild(one); w.document.getElementById('limitSel').value='1';
          w.document.getElementById('modeSel').value='cloze'; w.document.getElementById('startBtn').click(); w.document.getElementById('showAnswerBtn').click(); w.document.querySelector('.rating .btn[data-rate="good"]').click(); w.document.getElementById('nextBtn').click();
          if(w.document.getElementById('resultView').classList.contains('hidden'))throw new Error('cloze result missing');
          if(w.document.getElementById('rTotal').textContent!=='1'||w.document.getElementById('rGood').textContent!=='1')throw new Error('cloze result metrics');
          w.document.getElementById('resultHomeBtn').click(); w.document.getElementById('modeSel').value='memory'; w.document.getElementById('limitSel').value='1'; w.document.getElementById('startBtn').click();
          const box=w.document.getElementById('answerBox'),btn=w.document.getElementById('showAnswerBtn');
          if(box.classList.contains('show'))throw new Error('memory initial'); btn.click(); if(!box.classList.contains('show')||btn.textContent!=='答えを隠す')throw new Error('memory show'); btn.click(); if(box.classList.contains('show')||btn.textContent!=='答えを表示')throw new Error('memory hide'); btn.click(); w.document.querySelector('.rating .btn[data-rate="good"]').click();
          if(!w.document.getElementById('qCat').textContent.includes('暗記モード 完了'))throw new Error('memory complete');
          console.log('behavior QA OK');
          NODE
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Replace cloze dataset with compact 1390-card edition"
          git push origin HEAD:replace-data-compact-1390-20260819
