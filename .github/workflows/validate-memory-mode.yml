name: Validate memory mode
on:
  push:
    branches: [feature-memory-mode-20260816]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate JavaScript syntax
        run: |
          node --check memory-mode.js
          node --check sw.js
      - name: Validate 549-card app and memory integration
        run: |
          python - <<'PY'
          import base64, gzip, pathlib
          root=pathlib.Path('.')
          parts=[(root/f'app.part{i:02d}').read_text(encoding='utf-8') for i in range(1,11)]
          html=gzip.decompress(base64.b64decode(''.join(parts))).decode('utf-8')
          required_core=['function filteredCards','function renderCard','function showAnswer','function rateCurrent','function move','const STORE_KEY','"actual_cards":549']
          for token in required_core:
              assert token in html, f'missing core token: {token}'
          mem=(root/'memory-mode.js').read_text(encoding='utf-8')
          required_mem=['学習モード','暗記モード','答えを表示','↻ まだ','✓ 覚えた','memorySession.nextIds','memorySession.round++','state.memoryProgress','state.memorySession']
          for token in required_mem:
              assert token in mem, f'missing memory token: {token}'
          assert 'localStorage.clear' not in mem
          index=(root/'index.html').read_text(encoding='utf-8')
          assert './memory-mode.js?v=1' in index
          sw=(root/'sw.js').read_text(encoding='utf-8')
          assert "v11-memory-mode" in sw
          assert "'./memory-mode.js'" in sw
          print('memory mode validation: OK')
          PY
